<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Chain Sync Monitor</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/config.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <div>
        <h1>Chain Sync Monitor</h1>
      </div>
      <div class="toolbar">
        <p class="freshness" id="freshness" aria-live="polite"><span class="dot"></span><span id="freshness-text">Waiting for data</span></p>
        <button type="button" id="refresh">Refresh now</button>
      </div>
    </header>
    <p class="subtitle">Sync status for Bitcoin, CKB, and indexing services</p>
    <p id="notice" class="notice" role="status" hidden></p>
    <div id="networks"></div>
    <template id="network-template">
      <section class="network">
        <header class="network-header">
          <h2></h2>
          <span class="network-summary"></span>
        </header>
        <div class="cards"></div>
      </section>
    </template>
    <template id="service-template">
      <article class="card">
        <header class="card-header">
          <div>
            <p class="kind"></p>
            <div class="project-title">
              <h3></h3>
              <a class="github-link" target="_blank" rel="noopener noreferrer" hidden>
                <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/></svg>
              </a>
            </div>
          </div>
          <div class="service-states">
            <span class="state probe-state"><span class="dot" aria-hidden="true"></span><span class="state-label"></span></span>
            <span class="state sync-state"><span class="dot" aria-hidden="true"></span><span class="state-label"></span></span>
          </div>
        </header>
        <div class="service-charts" hidden>
          <div class="sync-comparisons"></div>
          <p class="no-sync-data" hidden>No sync data</p>
        </div>
        <details class="service-details">
          <summary>Details</summary>
          <dl class="metrics"></dl>
          <div class="availability" hidden>
            <p class="availability-title" title="Based on probe samples, independent of chain sync progress">Probe availability</p>
          <div class="uptime-group" hidden>
            <div class="progress-label">
              <span class="uptime-title">24-hour uptime</span>
              <span><span class="uptime-ratio"></span> <span class="uptime-count"></span></span>
            </div>
            <meter min="0" max="1" aria-label="24-hour uptime"></meter>
          </div>
            <dl class="availability-windows"></dl>
          </div>
          <p class="note" hidden></p>
        </details>
      </article>
    </template>
  </main>
</body>
</html>
