<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#090d10">
  <title>Chain Sync Monitor</title>
  <meta name="description" content="Live sync and uptime for Bitcoin, CKB, and indexing services on mainnet and testnet.">
  <meta property="og:title" content="Chain Sync Monitor">
  <meta property="og:description" content="Live sync and uptime for Bitcoin, CKB, and indexing services on mainnet and testnet.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chain-sync-monitor.netlify.app/">
  <meta property="og:image" content="https://chain-sync-monitor.netlify.app/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Chain Sync Monitor: Bitcoin and CKB synchronization dashboard.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/config.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#networks">Skip to Service Status</a>
  <main class="shell">
    <header class="page-header">
      <div>
        <h1>Chain Sync Monitor</h1>
      </div>
      <div class="toolbar">
        <p class="freshness" id="freshness"><span class="dot" aria-hidden="true"></span><span id="freshness-text">Waiting for data</span></p>
        <button type="button" id="refresh">Refresh now</button>
        <div class="language-picker">
          <label for="language" class="language-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="9"></circle>
              <ellipse cx="12" cy="12" rx="4" ry="9"></ellipse>
              <path d="M3 12h18"></path>
            </svg>
            <span id="language-label">Language</span>
          </label>
          <select id="language" name="language">
            <option id="language-auto" value="auto">Auto</option>
            <option value="zh-CN" lang="zh-CN">简体中文</option>
            <option value="zh-Hant" lang="zh-Hant">繁體中文</option>
            <option value="ja" lang="ja">日本語</option>
            <option value="fr" lang="fr">Français</option>
            <option value="de" lang="de">Deutsch</option>
            <option value="en" lang="en">English</option>
          </select>
        </div>
      </div>
    </header>
    <p id="refresh-announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p>
    <p class="subtitle">Sync status for Bitcoin, CKB, and indexing services</p>
    <p id="notice" class="notice" role="status" hidden></p>
    <div id="networks" tabindex="-1"></div>
    <template id="network-template">
      <section class="network">
        <header class="network-header">
          <h2></h2>
          <span class="network-summary"></span>
        </header>
        <div class="cards"></div>
      </section>
    </template>
    <template id="service-template">
      <article class="card">
        <header class="card-header">
          <div>
            <div class="card-context"><span class="kind"></span></div>
            <div class="project-title">
              <h3></h3>
              <a class="github-link" target="_blank" rel="noopener noreferrer" hidden>
                <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/></svg>
              </a>
            </div>
          </div>
          <div class="service-states">
            <span class="state card-network" hidden></span>
            <span class="state probe-state"><span class="dot" aria-hidden="true"></span><span class="state-label"></span></span>
            <span class="state sync-state"><span class="dot" aria-hidden="true"></span><span class="state-label"></span></span>
          </div>
        </header>
        <div class="service-charts" hidden>
          <div class="sync-comparisons"></div>
          <div class="http-measurements sync-strip" hidden>
            <dl class="sync-measurements">
              <div><dt class="http-status-label"></dt><dd class="http-status"></dd></div>
              <div><dt class="http-latency-label"></dt><dd class="http-latency"></dd></div>
            </dl>
          </div>
          <div class="dob-measurements sync-strip" hidden>
            <dl class="sync-measurements">
              <div><dt></dt><dd translate="no"></dd></div>
            </dl>
          </div>
          <p class="no-sync-data" hidden>No sync data</p>
        </div>
        <details class="service-details">
          <summary><span class="details-label">Details</span><span class="service-uptime"><span class="uptime-history" aria-hidden="true" hidden></span><span class="service-uptime-label"></span> <span class="service-uptime-value"></span></span></summary>
          <dl class="metrics"></dl>
          <div class="availability" hidden>
            <p class="availability-title" title="Based on probe samples, independent of chain sync progress">Probe availability</p>
          <div class="uptime-group" hidden>
            <div class="progress-label">
              <span class="uptime-title">24-hour uptime</span>
              <span><span class="uptime-ratio"></span> <span class="uptime-count"></span></span>
            </div>
            <meter min="0" max="1" aria-label="24-hour uptime"></meter>
          </div>
            <div class="uptime-history-detail">
            <p class="uptime-history-caption"></p>
            <ul class="uptime-history-key" hidden></ul>
            <details class="uptime-breakdown" hidden>
              <summary>Interval Breakdown</summary>
              <ol class="uptime-history-ranges"></ol>
            </details>
          </div>
          <dl class="availability-windows"></dl>
          </div>
          <p class="note" hidden></p>
        </details>
      </article>
    </template>
  </main>
</body>
</html>
