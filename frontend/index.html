<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Chain Sync Monitor</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/config.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">CHAIN SYNC MONITOR</p>
        <h1>Chain Sync Monitor</h1>
      </div>
      <div class="toolbar">
        <p class="freshness" id="freshness" aria-live="polite"><span class="dot"></span><span id="freshness-text">Waiting for data</span></p>
        <button type="button" id="refresh">Refresh now</button>
      </div>
    </header>
    <p class="subtitle">Sync status for Bitcoin, CKB, and indexing services</p>
    <p id="notice" class="notice" role="status" hidden></p>
    <div id="networks"></div>
    <template id="network-template">
      <section class="network">
        <header class="network-header">
          <span class="network-code" aria-hidden="true"></span>
          <h2></h2>
          <span class="network-summary"></span>
        </header>
        <div class="cards"></div>
      </section>
    </template>
    <template id="service-template">
      <article class="card">
        <header class="card-header">
          <div>
            <p class="kind"></p>
            <h3></h3>
          </div>
          <div class="service-states">
            <span class="state probe-state"><span class="dot" aria-hidden="true"></span><span class="state-label"></span></span>
            <span class="state sync-state"><span class="dot" aria-hidden="true"></span><span class="state-label"></span></span>
          </div>
        </header>
        <div class="service-charts">
          <div class="progress-group" hidden>
            <div class="progress-label"><span class="progress-title">Sync progress</span><span class="progress-value"></span></div>
            <progress max="1" aria-label="Sync progress" hidden></progress>
          </div>
          <div class="uptime-group">
            <div class="progress-label">
              <span class="uptime-title">24-hour uptime</span>
              <span><span class="uptime-ratio"></span> <span class="uptime-count"></span></span>
            </div>
            <meter min="0" max="1" aria-label="24-hour uptime" hidden></meter>
          </div>
        </div>
        <details class="service-details">
          <summary>Details</summary>
          <dl class="metrics"></dl>
          <div class="availability" hidden>
            <p class="availability-title" title="Based on probe samples, independent of chain sync progress">Probe availability</p>
            <dl class="availability-windows"></dl>
          </div>
          <p class="note" hidden></p>
        </details>
      </article>
    </template>
  </main>
</body>
</html>
