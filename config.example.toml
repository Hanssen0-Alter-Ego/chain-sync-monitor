[monitor]
host = "127.0.0.1"
port = 8080
interval_seconds = 15
timeout_seconds = 4
# For a separate web frontend, add its exact origin (no path).
# cors_origins = ["https://status.example.com"]
# Opt in to the Netlify site domain and its deployment-ID permalinks.
# cors_netlify_site = "chain-sync-monitor"

[networks.mainnet.ckb]
url = "http://127.0.0.1:8114"

[networks.mainnet.btc]
url = "http://127.0.0.1:8332"
username = "monitor"
password_file = "btc-mainnet.password"

[networks.mainnet.spv]
url = "http://127.0.0.1:8888"
# Optional: uncomment and set all three fields to track on-chain progress.
# [networks.mainnet.spv.type_script]
# code_hash = "0x..."
# hash_type = "type"
# args = "0x..."

# Optional: compare SPV against a separate, fully synced Bitcoin Core.
# Without this section the monitor compares against networks.mainnet.btc.
# Allow only getblockchaininfo and getblockhash for the reference RPC account.
# [networks.mainnet.spv.bitcoin_reference]
# url = "http://10.0.0.2:8332"
# username = "monitor"
# password_file = "btc-reference.password"

[networks.testnet.ckb]
url = "http://127.0.0.1:8116"

[networks.testnet.btc]
url = "http://127.0.0.1:18332"
username = "monitor"
password_file = "btc-testnet3.password"

[networks.testnet.blockbook]
url = "http://127.0.0.1:19130/api/"

[networks.testnet.spv]
url = "http://127.0.0.1:8889"
# [networks.testnet.spv.type_script]
# code_hash = "0x..."
# hash_type = "type"
# args = "0x..."

# Optional services: add when they are reachable from the monitor.
# [networks.mainnet.blockbook]
# url = "http://127.0.0.1:19131/api/"
#
# [networks.mainnet.ckbadger]
# url = "http://127.0.0.1:8100/api/mainnet/v1/statistics/network"
# public_url = "https://explorer.example.com/"
#
# For standalone CKBadger (one server per network), use /api/v1/statistics/network.
# [networks.testnet.ckbadger]
# url = "http://127.0.0.1:8100/api/testnet/v1/statistics/network"
#
# Repeat this array table with a different stable ID for each HTTP-only probe.
# [[networks.testnet.http]]
# id = "btc-asset-api"
# label = "BTC Asset API"
# github_url = "https://github.com/RGBPlusPlus/btc-assets-api"
# url = "http://127.0.0.1:3000/healthcheck"

# DOB Decoder uptime and advertised versions (JSON-RPC; not chain sync).
# Uncomment whichever instances you want to monitor.
# [networks.mainnet.dob_decoder]
# url = "https://dob-decoder.ckbccc.com"
#
# [networks.testnet.dob_decoder]
# url = "https://dob-decoder-test.ckbccc.com"

# Optional: Cloudflare Email Sending over HTTPS. Leave commented to disable.
# [alerts.email]
# enabled = true
# account_id = "0123456789abcdef0123456789abcdef"
# api_token_file = "cloudflare-email.token"
# from = "monitor@notify.ckbccc.com"
# to = "alerts@example.com"
# status_url = "https://monitor.example.com/"
# failure_checks = 3
# recovery_checks = 2

# Optional: organize the dashboard by project or purpose instead of by network.
# Group keys are independent of the chain; quoted keys may contain spaces or Unicode.
# Move (do not duplicate) existing probes when grouping them. Their service IDs
# and history stay unchanged if the kind, network and HTTP id stay the same.
#
# [groups.infrastructure]
# label = "Infrastructure"
#
# [[groups.infrastructure.services]]
# kind = "btc"
# network = "mainnet"
# url = "http://127.0.0.1:8332"
# username = "monitor"
# password_file = "btc-mainnet.password"
#
# [[groups.infrastructure.services]]
# kind = "http"
# id = "portal"
# label = "Portal"
# url = "https://portal.example.com/health"
# Omit network for a service that does not belong to a chain.
