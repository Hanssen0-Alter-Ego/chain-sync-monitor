services:
  monitor:
    build: .
    image: ghcr.io/hanssen0-alter-ego/chain-sync-monitor:latest
    environment:
      MONITOR_API_ONLY: "${MONITOR_API_ONLY:-0}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - monitor-history:/data
      - type: bind
        source: ./config
        target: /config
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  monitor-history:
