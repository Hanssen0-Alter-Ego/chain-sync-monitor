name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test

  image-check:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: chain-sync-monitor:smoke
      - name: Smoke test both Docker modes
        shell: bash
        run: |
          config_dir="$(mktemp -d)"
          chmod 0755 "$config_dir"
          printf '[monitor]\ncors_origins = ["https://status.example.com"]\n' > "$config_dir/config.toml"
          chmod 0644 "$config_dir/config.toml"
          trap 'docker logs monitor-smoke 2>&1 || true; docker rm -fv monitor-smoke >/dev/null 2>&1 || true; rm -rf "$config_dir"' EXIT
          for api_only in 0 1; do
            docker run -d --name monitor-smoke --read-only \
              -e MONITOR_API_ONLY="$api_only" -p 127.0.0.1:8080:8080 \
              --mount "type=bind,src=$config_dir,dst=/config,readonly" \
              chain-sync-monitor:smoke
            curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 2 -sS \
              -H 'Origin: https://status.example.com' -D "$config_dir/headers" \
              -o "$config_dir/status.json" http://127.0.0.1:8080/api/status
            grep -qi '^access-control-allow-origin: https://status.example.com' "$config_dir/headers"
            jq -e '(.services == []) and (has("historyError") | not)' "$config_dir/status.json"
            docker exec monitor-smoke test -s /data/history.sqlite3
            if [ "$api_only" = 1 ]; then
              test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 404
            else
              curl -fsS http://127.0.0.1:8080/ >"$config_dir/index.html"
              grep -Fq '<h1>Chain Sync Monitor</h1>' "$config_dir/index.html"
              curl -fsS http://127.0.0.1:8080/app.js >"$config_dir/app.js"
              grep -q '/api/status' "$config_dir/app.js"
            fi
            docker rm -fv monitor-smoke
          done

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
